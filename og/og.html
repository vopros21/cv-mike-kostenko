<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>singledev.eu — social preview</title>
<style>
  /* Colours and fonts mirror docs/styles.css (light theme) */
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../docs/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("../docs/fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
  :root { --page: #FAFBFC; --ink: #14171C; --muted: #545B66; --line: #E3E6EA; --live: #0E7C71; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: "IBM Plex Sans", sans-serif;
    color: var(--ink); background: var(--page); -webkit-font-smoothing: antialiased;
    padding: 0 96px;
    display: flex; flex-direction: column; justify-content: center;
  }
  h1 { font-size: 96px; line-height: 1.02; letter-spacing: -0.02em; font-weight: 600; margin: 0 0 24px; }
  .role { font-size: 44px; margin: 0 0 18px; }
  .facts { font-size: 34px; color: var(--muted); margin: 0; }
  .url { position: absolute; left: 96px; right: 96px; bottom: 64px; padding-top: 28px; border-top: 2px solid var(--line);
         font-size: 30px; font-weight: 600; display: flex; align-items: center; gap: 16px; }
</style>
</head>
<body>
  <h1>Mike Kostenko</h1>
  <p class="role">Java Developer</p>
  <p class="facts">OCP Java SE 21, fintech, Porto</p>
  <div class="url">singledev.eu</div>
</body>
</html>
