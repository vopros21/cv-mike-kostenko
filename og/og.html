<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>singledev.eu — social preview</title>
<style>
  /* Colours mirror docs/styles.css (:root, light theme) */
  :root {
    --bg: #eef1f8; --text: #1d1d1f; --muted: #5f6470; --faint: #8a8f99;
    --accent: #0a66d8; --accent-soft: rgba(10, 102, 216, 0.10);
    --glass: rgba(255, 255, 255, 0.55); --glass-edge: rgba(255, 255, 255, 0.85);
    --blob-1: rgba(96, 140, 255, 0.45); --blob-2: rgba(170, 120, 255, 0.35); --blob-3: rgba(60, 200, 190, 0.30);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
  }
  body::before {
    content: ""; position: absolute; inset: -120px; z-index: 0;
    background:
      radial-gradient(640px 520px at 8% 10%, var(--blob-1), transparent 70%),
      radial-gradient(620px 520px at 96% 26%, var(--blob-2), transparent 70%),
      radial-gradient(700px 480px at 40% 104%, var(--blob-3), transparent 70%),
      radial-gradient(460px 380px at 100% 100%, var(--blob-1), transparent 70%);
    filter: blur(20px);
  }
  .card {
    position: relative; z-index: 1;
    width: 1080px; height: 510px; padding: 52px 72px 48px;
    border-radius: 36px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
    border: 1.5px solid var(--glass-edge);
    box-shadow: 0 2px 2px rgba(20, 30, 60, 0.04), 0 20px 60px rgba(20, 30, 60, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    display: flex; flex-direction: column;
  }
  .card > * { flex-shrink: 0; }
  .mono {
    width: 84px; height: 84px; border-radius: 23px;
    display: grid; place-items: center;
    font-weight: 700; font-size: 31px; letter-spacing: 0.02em;
    color: var(--accent); background: var(--accent-soft);
    margin-bottom: 30px;
  }
  h1 { font-size: 84px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 700; margin: 0 0 14px; }
  .role {
    align-self: flex-start; font-size: 40px; font-weight: 600; margin: 0 0 22px;
    background: linear-gradient(90deg, var(--accent), #7b5cff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .facts { font-size: 34px; color: var(--muted); margin: 0; }
  .url { margin-top: auto; font-size: 30px; font-weight: 600; color: var(--accent); align-self: flex-end; }
</style>
</head>
<body>
  <div class="card">
    <div class="mono">MK</div>
    <h1>Mike Kostenko</h1>
    <p class="role">Java Developer</p>
    <p class="facts">OCP Java SE 21 · Fintech · Porto</p>
    <div class="url">singledev.eu</div>
  </div>
</body>
</html>
